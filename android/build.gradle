// android/build.gradle (project-level)

// Make groovy-xml available to the buildscript
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath localGroovy()
        classpath "org.codehaus.groovy:groovy-xml:3.0.21"
    }
}

import groovy.util.XmlParser
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Configure only after the Android plugins are applied (no afterEvaluate)
subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Application modules
    plugins.withId("com.android.application") {
        project.android {
            // AGP 8+: "compileSdk" also works; keep this for compatibility
            compileSdkVersion 34
        }
    }

    // Library modules
    plugins.withId("com.android.library") {
        project.android {
            compileSdkVersion 34
            if (project.android.hasProperty("compileSdk")) {
                project.android.compileSdk = 34
            }

            // Set namespace from manifest if missing (best-effort)
            def currentNamespace = project.android.hasProperty("namespace") ? project.android.namespace : null
            if (!currentNamespace) {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    try {
                        def manifest = new XmlParser(false, false).parse(manifestFile)
                        def manifestPackage = manifest?.attributes()?.get("package")
                        if (manifestPackage) {
                            project.android.namespace = manifestPackage
                        }
                    } catch (Exception ignored) {
                        // Best effort; namespace must be provided for AGP 8+.
                    }
                }
            }

            // Ensure Java/Kotlin compilation targets stay aligned across all
            // library modules (including third-party plugins).
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            project.tasks.withType(KotlinCompile).configureEach { task ->
                def target = project.android?.compileOptions?.targetCompatibility ?: JavaVersion.VERSION_17
                task.kotlinOptions {
                    jvmTarget = target.toString()
                }
            }
        }
    }

    project.afterEvaluate {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileSdkVersion 34
            if (androidExt.hasProperty("compileSdk")) {
                androidExt.compileSdk = 34
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
