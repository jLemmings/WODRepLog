// android/build.gradle (project-level)

// 1) Make groovy-xml resolvable for the buildscript itself
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath localGroovy()
        classpath "org.codehaus.groovy:groovy-xml:3.0.21"
    }
}

// (optional) You can keep the import here now that the buildscript classpath is set
import groovy.util.XmlParser

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
            project.plugins.hasPlugin("com.android.library")) {

            project.android {
                compileSdkVersion 34
            }

            if (project.plugins.hasPlugin("com.android.library")) {
                def currentNamespace = null
                if (project.android.hasProperty("namespace")) {
                    currentNamespace = project.android.namespace
                }

                if (!currentNamespace) {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        try {
                            // If you removed the import, use: new groovy.util.XmlParser(false, false)
                            def manifest = new XmlParser(false, false).parse(manifestFile)
                            def manifestPackage = manifest?.attributes()?.get("package")
                            if (manifestPackage) {
                                project.android.namespace = manifestPackage
                            }
                        } catch (Exception ignored) {
                            // Best effort – namespace must be provided for AGP 8+.
                        }
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
