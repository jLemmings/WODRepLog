name: Build Dev

on:
  push:
    branches-ignore:
      - master

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 21

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v7

      # Setup Java in the VM
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      # Run flutter commands
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: flutter doctor --verbose
        run: flutter doctor --verbose

      - name: Prepare signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_FILE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_SIGNING_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_SIGNING_KEY_PASSWORD }}
        run: |
          WORKSPACE="$(pwd)"
          if [ -n "$DEV_KEYSTORE_BASE64" ] && \
             [ -n "$DEV_KEYSTORE_PASSWORD" ] && \
             [ -n "$DEV_KEY_ALIAS" ] && \
             [ -n "$DEV_KEY_PASSWORD" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 --decode > android/app/dev.keystore
            echo "ANDROID_KEYSTORE_PATH=$WORKSPACE/android/app/dev.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$DEV_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$DEV_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$DEV_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            KEYSTORE="android/app/debug.keystore"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkeypair -v \
                -storetype PKCS12 \
                -keystore "$KEYSTORE" \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "ANDROID_DEBUG_KEYSTORE=$WORKSPACE/$KEYSTORE" >> "$GITHUB_ENV"
            echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ANDROID_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "USE_DEBUG_SIGNING_FOR_RELEASE=true" >> "$GITHUB_ENV"
          fi
      
      - name: Read version info
        id: version
        run: ./scripts/manage_version.sh current

      - name: Export version info
        run: |
          echo "VERSION_NAME=${{ steps.version.outputs.new_version }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ steps.version.outputs.version_code }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --split-per-abi

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-v8a-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-armeabi-v7a-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-x86_64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error


          

