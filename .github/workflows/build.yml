name: Build

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0
      FLUTTER_VERSION: 3.22.3

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v4

      # Setup Java in the VM
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Define which stable flutter version should be used
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Run flutter commands
      - name: 📦 Install dependencies
        run: flutter pub get

      # - name: 🕵️ Analyze to check for bad Dart/Flutter practices
      #   run: flutter analyze

      # - name: 🕵️ flutter doctor --verbose
      #   run: flutter doctor --verbose

      # # Bundle
      # - name: Build release app bundle
      #   run: flutter build appbundle

      # - name: Sign App Bundle
      #   uses: r0adkll/sign-android-release@v1
      #   id: sign_app
      #   with:
      #     releaseDirectory: build/app/outputs/bundle/release/
      #     signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
      #     alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      #     keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      # - name: Upload Signed App Bundle
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: signed-app-bundle
      #     path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      # APK
      - name: Build release apk bundle
        run: flutter build apk --split-per-abi

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Sign APK Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: build/app/outputs/flutter-apk/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Upload Signed APK Bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-bundle-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload Signed APK Bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-bundle-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release-aligned.apk

      - name: Upload Signed APK Bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-bundle-x86
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
      # - name: Upload to Play Store (Internal Testing)
      #   uses: r0adkll/upload-google-play@v1.0.18
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      #     packageName: com.testgroup.flutter_github_actions_android
      #     releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}
      #     mappingFile: ./build/app/outputs/mapping/release/mapping.txt
      #     track: internal
