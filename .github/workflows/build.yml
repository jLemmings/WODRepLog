name: Build Dev

on:
  push:
    branches-ignore:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0
      FLUTTER_VERSION: 3.35.5
      VERSION_NAME: ${{ github.event.release.tag_name }}
      VERSION_CODE: ${{github.run_number}}

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v5

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Define which stable flutter version should be used
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Run flutter commands
      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🕵️ Analyze to check for bad Dart/Flutter practices
        run: flutter analyze

      - name: 🕵️ flutter doctor --verbose
        run: flutter doctor --verbose

      # Bundle
      - name: Build release app bundle
        run: flutter build appbundle

      - name: Upload release app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  
