name: Build Dev

on:
  push:
    branches-ignore:
      - master

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0
      FLUTTER_VERSION: 3.35.5

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Increment build number
        id: version
        run: ./scripts/manage_version.sh increment-build

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: increment dev build number to ${{ steps.version.outputs.new_version }} [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: pubspec.yaml

      - name: Export version info
        run: |
          echo "VERSION_NAME=${{ steps.version.outputs.new_version }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ steps.version.outputs.build_number }}" >> "$GITHUB_ENV"

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Define which stable flutter version should be used
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Run flutter commands
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: flutter doctor --verbose
        run: flutter doctor --verbose

      # Build bundle
      - name: Build release APK
        run: flutter build apk --split-per-abi --build-number=${{ env.VERSION_CODE }} --build-name=${{ env.VERSION_NAME }}

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/flutter-apk/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error


          

