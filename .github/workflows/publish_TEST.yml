name: Create Release

on:
  push:
    branches:
      - "master"

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Read version info
        id: version
        run: ./scripts/manage_version.sh current

      - name: Check release eligibility
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          previous_version=""
          if [ -n "$BEFORE_SHA" ] && \
             [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "$BEFORE_SHA:pubspec.yaml" 2>/dev/null; then
            previous_version="$(git show "$BEFORE_SHA:pubspec.yaml" | grep -E '^version:' | awk '{print $2}' | tr -d '\r')"
          fi

          version_changed=false
          if [ -z "$previous_version" ] || [ "$previous_version" != "$CURRENT_VERSION" ]; then
            version_changed=true
          fi

          release_tag="v${CURRENT_VERSION}"
          release_exists=false
          if gh release view "$release_tag" >/dev/null 2>&1; then
            release_exists=true
          fi

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_exists=true
          fi

          should_create=false
          if [ "$version_changed" = true ] && \
             [ "$release_exists" = false ] && \
             [ "$tag_exists" = false ]; then
            should_create=true
          fi

          {
            echo "previous_version=$previous_version"
            echo "current_version=$CURRENT_VERSION"
            echo "tag=$release_tag"
            echo "version_changed=$version_changed"
            echo "release_exists=$release_exists"
            echo "tag_exists=$tag_exists"
            echo "should_create=$should_create"
          } >> "$GITHUB_OUTPUT"

          if [ "$should_create" != true ]; then
            echo "Skipping GitHub release for $CURRENT_VERSION."
            echo "version_changed=$version_changed release_exists=$release_exists tag_exists=$tag_exists"
          fi

      - name: Create GitHub release
        if: steps.release_gate.outputs.should_create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_gate.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.new_version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION_NAME" \
            --generate-notes
