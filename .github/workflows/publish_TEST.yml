name: Publish Testing

on:
  push:
    branches:
      - "master"

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0
      FLUTTER_VERSION: 3.35.5

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Bump patch version
        id: bump_version
        run: |
          current_version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          version_core=${current_version%%+*}
          if [[ "$current_version" == *"+"* ]]; then
            build_suffix=${current_version#*+}
          else
            build_suffix=""
          fi
          IFS='.' read -r major minor patch <<< "$version_core"
          patch=$((patch + 1))
          if [[ "$build_suffix" =~ ^[0-9]+$ ]]; then
            new_build_number=$((build_suffix + 1))
          else
            new_build_number=1
          fi
          github_run_number=${GITHUB_RUN_NUMBER:-0}
          if [[ "$github_run_number" =~ ^[0-9]+$ ]] && (( github_run_number > new_build_number )); then
            new_build_number=$github_run_number
          fi
          min_build_number=1000
          if (( new_build_number < min_build_number )); then
            new_build_number=$min_build_number
          fi
          new_version="${major}.${minor}.${patch}+${new_build_number}"
          echo "Bumping version: ${current_version} -> ${new_version}"
          sed -i "s/^version: .*/version: ${new_version}/" pubspec.yaml
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "new_build_number=${new_build_number}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: bump test build version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: pubspec.yaml

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Define which stable flutter version should be used
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Run flutter commands
      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🕵️ Analyze to check for bad Dart/Flutter practices
        run: flutter analyze

      - name: 🕵️ flutter doctor --verbose
        run: flutter doctor --verbose

      # Bundle
      - name: Build release app bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ steps.bump_version.outputs.new_build_number }} \
            --build-name=${{ steps.bump_version.outputs.new_version }}

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ch.joshuahemmings.wodreplog
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          releaseName: ${{ steps.bump_version.outputs.new_version }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: internal
