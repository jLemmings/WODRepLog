name: Publish Testing

on:
  push:
    branches:
      - "master"

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0
      FLUTTER_VERSION: 3.46.0

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v6

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin Flutter for reproducible builds
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Run flutter commands
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: flutter doctor --verbose
        run: flutter doctor --verbose

      - name: Increment build number
        id: version
        run: ./scripts/manage_version.sh increment-build

      - name: Export version info
        run: |
          echo "VERSION_NAME=${{ steps.version.outputs.new_version }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ steps.version.outputs.build_number }}" >> "$GITHUB_ENV"

      # Build bundle
      - name: Build release app bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ env.VERSION_CODE }} \
            --build-name=${{ env.VERSION_NAME }}

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump test build number to ${{ steps.version.outputs.new_version }} [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: pubspec.yaml

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ch.joshuahemmings.wodreplog
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          releaseName: ${{ env.VERSION_NAME }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: alpha
