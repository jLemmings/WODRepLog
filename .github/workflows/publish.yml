name: Publish Android Tracks

on:
  push:
    branches:
      - master
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0
      FLUTTER_VERSION: 3.35.5

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Install Groovy
        run: |
          sudo apt-get update
          sudo apt-get install -y groovy

      - name: Check Groovy version
        run: |
          groovy -version

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Define which stable flutter version should be used
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Run flutter commands
      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🕵️ Analyze to check for bad Dart/Flutter practices
        run: flutter analyze

      - name: 🕵️ flutter doctor --verbose
        run: flutter doctor --verbose

      - name: Extract version from pubspec.yaml
        id: app_version
        run: |
          set -eo pipefail
          VERSION_VALUE=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/version:[[:space:]]*//')
          VERSION_NAME=${VERSION_VALUE%%+*}
          if [[ "$VERSION_VALUE" == *"+"* ]]; then
            VERSION_CODE=${VERSION_VALUE##*+}
          else
            VERSION_CODE=${GITHUB_RUN_NUMBER}
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Determine Play Store track
        id: track
        run: |
          if [ "$GITHUB_REF" = "refs/heads/release" ]; then
            echo "track=production" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            echo "track=internal" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
          fi

      # Bundle
      - name: Build release app bundle
        run: flutter build appbundle --release --build-number=${{ steps.app_version.outputs.version_code }} --build-name=${{ steps.app_version.outputs.version_name }}

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ch.joshuahemmings.wodreplog
          releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}
          releaseName: ${{ steps.app_version.outputs.version_name }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.status }}
