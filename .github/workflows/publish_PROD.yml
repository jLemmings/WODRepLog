name: Publish PROD

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v6

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Use latest stable Flutter so CI stays compatible with AGP 9 new DSL changes
          channel: stable
          cache: true

      # Run flutter commands
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: flutter doctor --verbose
        run: flutter doctor --verbose

      - name: Apply release version
        id: version
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_input="${RELEASE_NAME:-}"
          if [ -z "$release_input" ]; then
            release_input="$RELEASE_TAG"
          fi
          if [ -z "$release_input" ]; then
            echo "Release name or tag must be provided" >&2
            exit 1
          fi
          ./scripts/manage_version.sh release "$release_input"

      - name: Export version info
        run: |
          echo "VERSION_NAME=${{ steps.version.outputs.new_version }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ steps.version.outputs.build_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${{ steps.version.outputs.base_version }}" >> "$GITHUB_ENV"

      # Build bundle
      - name: Build release app bundle
        run: flutter build appbundle --release --build-number=${{ env.VERSION_CODE }} --build-name=${{ env.VERSION_NAME }}

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: prepare release version ${{ steps.version.outputs.new_version }} [skip ci]"
          branch: ${{ github.event.repository.default_branch }}
          file_pattern: pubspec.yaml

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ch.joshuahemmings.wodreplog
          releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}
          releaseName: ${{ env.VERSION_NAME }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: alpha
