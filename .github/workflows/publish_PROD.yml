name: Publish PROD

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 19.0
      FLUTTER_VERSION: 3.35.5

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Read version from pubspec
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          if [ -z "$version" ]; then
            echo 'Unable to locate version in pubspec.yaml' >&2
            exit 1
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *"+"* ]]; then
            build_suffix=${version#*+}
          else
            echo 'pubspec version must include a build number suffix (e.g. 1.2.3+4).' >&2
            exit 1
          fi
          if [[ ! "$build_suffix" =~ ^[0-9]+$ ]]; then
            echo "Build number must be numeric, got: $build_suffix" >&2
            exit 1
          fi
          echo "VERSION_CODE=$build_suffix" >> "$GITHUB_ENV"

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Define which stable flutter version should be used
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Run flutter commands
      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🕵️ Analyze to check for bad Dart/Flutter practices
        run: flutter analyze

      - name: 🕵️ flutter doctor --verbose
        run: flutter doctor --verbose

      # Bundle
      - name: Build release app bundle
        run: flutter build appbundle --release --build-number=${{ env.VERSION_CODE }} --build-name=${{ env.VERSION_NAME }}

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ch.joshuahemmings.wodreplog
          releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}
          releaseName: ${{ env.VERSION_NAME }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: internal
