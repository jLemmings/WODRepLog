name: Publish PROD

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 21

    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v6

      # Setup Java in the VM
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Setup Java in the VM
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      # Run flutter commands
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: flutter doctor --verbose
        run: flutter doctor --verbose

      - name: Read version info
        id: version
        run: ./scripts/manage_version.sh current

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" != "$VERSION_NAME" ] && [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "Release tag '$RELEASE_TAG' must match pubspec version '$VERSION_NAME' or 'v$VERSION_NAME'." >&2
            exit 1
          fi

      - name: Export version info
        run: |
          echo "VERSION_NAME=${{ steps.version.outputs.new_version }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ steps.version.outputs.build_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${{ steps.version.outputs.base_version }}" >> "$GITHUB_ENV"

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ch.joshuahemmings.wodreplog
          releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}
          releaseName: ${{ env.VERSION_NAME }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: alpha

